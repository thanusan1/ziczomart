name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to EC2 via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-05c70082ff8a85c52" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["su - ubuntu -c \"cd /home/ubuntu/ziczomart && git pull origin master && docker compose --env-file .env.local up -d --build && docker image prune -f\""]' \
            --query "Command.CommandId" \
            --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-05c70082ff8a85c52" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Deploy status ($i/60): $STATUS"
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
              break
            fi
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-05c70082ff8a85c52" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text
          test "$STATUS" = "Success"
